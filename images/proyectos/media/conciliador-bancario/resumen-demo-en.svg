<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 650" role="img" aria-labelledby="title desc"><title id="title">Bank reconciliation demo</title><desc id="desc">Fictional Bank A sample: 3 matched payments and 4 items to review.</desc><rect width="1360" height="650" rx="18" fill="#0c1828"/><g font-family="Arial,sans-serif"><text x="64" y="65" font-size="17" letter-spacing="3" fill="#51c6a0">PUBLIC DEMO · FICTIONAL DATA</text><text x="64" y="141" fill="#e5ecf4" font-size="43">Payments matched. Differences in view.</text><text x="64" y="185" fill="#8ea4bc" font-size="20">Bank A · Fictional closing · 15 Apr 2030</text><g transform="translate(64,230)"><rect width="290" height="155" rx="10" fill="#132438" stroke="#263d53"/><text x="24" y="72" fill="#51c6a0" font-size="44">3</text><text x="24" y="117" fill="#acbdce" font-size="18">Matched</text></g><g transform="translate(374,230)"><rect width="290" height="155" rx="10" fill="#132438" stroke="#263d53"/><text x="24" y="72" fill="#51c6a0" font-size="44">1</text><text x="24" y="117" fill="#acbdce" font-size="18">Amount difference</text></g><g transform="translate(684,230)"><rect width="290" height="155" rx="10" fill="#132438" stroke="#263d53"/><text x="24" y="72" fill="#51c6a0" font-size="44">2</text><text x="24" y="117" fill="#acbdce" font-size="18">System only</text></g><g transform="translate(994,230)"><rect width="290" height="155" rx="10" fill="#132438" stroke="#263d53"/><text x="24" y="72" fill="#51c6a0" font-size="44">1</text><text x="24" y="117" fill="#acbdce" font-size="18">Bank only</text></g><path d="M64 438H1296" stroke="#263d53"/><text x="64" y="491" fill="#e5ecf4" font-size="23">Two reports → Compare payments → Review differences</text><text x="64" y="547" fill="#8ea4bc" font-size="19">Customer + reference · Closing cutoffs · Source copies</text><text x="64" y="601" fill="#51c6a0" font-size="17">EDUARDO VITE LEÓN</text></g></svg>