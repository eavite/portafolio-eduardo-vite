<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Estos dos textos son los que ven Google y las vistas previas al compartir el enlace.
	     Cámbialos aquí también (el resto del contenido se cambia en js/config.js). -->
	<title>Eduardo Vite León | Data Analyst & BI | Python, SQL, Power BI</title>
	<meta name="description" content="Portafolio de Eduardo Vite León, Analista de Datos y BI con experiencia en retail y crédito. Análisis, automatización y visualización con Python, SQL, Power BI y Excel.">

	<script>
		/* Aplica el tema guardado antes de pintar la página, para evitar parpadeos */
		try {
			var t = localStorage.getItem('theme');
			if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
		} catch (e) {}
	</script>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/style.css">
</head>
<body id="top">

	<!-- Fondo ambiental: una red de nodos que se conectan, evocando una conciliación.
	     Es decorativo (aria-hidden) y vive detrás de todo el contenido. -->
	<canvas id="bg-canvas" class="bg-canvas" aria-hidden="true"></canvas>

	<a class="skip" href="#main">Saltar al contenido</a>

	<header class="site-nav">
		<div class="wrap nav-inner">
			<a class="brand" id="brand" href="#top"></a>
			<nav aria-label="Principal">
				<ul class="nav-links" id="nav-links"></ul>
			</nav>
			<label class="language-switcher" for="language-switcher">
				<span class="visually-hidden">Idioma</span>
				<select id="language-switcher" aria-label="Idioma">
					<option value="es">ES</option>
					<option value="en">EN</option>
				</select>
			</label>
			<button class="cmdk-trigger" id="cmdk-trigger" type="button" aria-haspopup="dialog" aria-controls="cmdk-overlay" title="Buscar una acción">
				<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
				<span>Buscar</span>
				<kbd id="cmdk-shortcut-hint">Ctrl K</kbd>
			</button>
			<button class="icon-btn" id="theme-toggle" type="button" aria-label="Cambiar entre tema claro y oscuro" title="Cambiar tema">
				<svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
				<svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
			</button>
		</div>
	</header>

	<main id="main">

		<!-- Portada -->
		<section class="hero" aria-labelledby="hero-name">
			<div class="wrap hero-grid">
				<div class="hero-copy">
					<h1 id="hero-name"></h1>
					<p class="hero-role" id="hero-role"></p>
					<p class="hero-tagline" id="hero-tagline"></p>
					<ul class="tags" id="hero-stack"></ul>
					<div class="actions" id="hero-actions"></div>
				</div>

				<div class="deck-wrap" id="deck-wrap">
					<div class="deck" id="deck">
						<div class="deck-viewport" id="deck-viewport">
							<div class="deck-track" id="deck-track"></div>
						</div>
						<button class="deck-arrow deck-prev" id="deck-prev" type="button">
							<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7"/></svg>
							<span class="visually-hidden" id="deck-prev-label"></span>
						</button>
						<button class="deck-arrow deck-next" id="deck-next" type="button">
							<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7"/></svg>
							<span class="visually-hidden" id="deck-next-label"></span>
						</button>
					</div>
					<div class="deck-foot">
						<div class="deck-dots" id="deck-dots" role="tablist"></div>
						<button class="text-btn" id="deck-replay" type="button">Repetir</button>
					</div>
					<p class="visually-hidden" id="deck-status" aria-live="polite"></p>
				</div>
			</div>
		</section>

		<!-- Sobre mí -->
		<section class="section section--about" id="sobre-mi" aria-labelledby="about-title">
			<div class="wrap">
				<h2 id="about-title"></h2>
				<div class="about-grid">
					<div class="prose" id="about-text"></div>
					<aside class="about-side">
						<div id="avatar"></div>
						<div class="experience-card" id="experience-card">
							<p class="experience-eyebrow" id="experience-eyebrow"></p>
							<h3 id="experience-title"></h3>
							<p class="experience-meta" id="experience-meta"></p>
							<ul id="experience-points"></ul>
						</div>
						<p class="side-title" id="skills-title"></p>
						<ul class="tags" id="skills"></ul>
					</aside>
				</div>
			</div>
		</section>

		<!-- Tecnologías -->
		<section class="section" id="tecnologias" aria-labelledby="tech-title">
			<div class="wrap">
				<h2 id="tech-title"></h2>
				<p class="section-intro" id="tech-intro"></p>
				<ul class="tech-grid" id="tech-grid"></ul>
			</div>
		</section>

		<!-- Resultados -->
		<section class="section" id="resultados" aria-labelledby="impact-title">
			<div class="wrap">
				<h2 id="impact-title"></h2>
				<p class="section-intro" id="impact-intro"></p>
				<div class="impact-grid" id="impact-metrics"></div>
			</div>
		</section>

		<!-- Proyectos -->
		<section class="section" id="proyectos" aria-labelledby="projects-title">
			<div class="wrap">
				<h2 id="projects-title"></h2>
				<p class="section-intro" id="projects-intro"></p>
				<div class="pfolio" id="project-list"></div>
				<div class="actions projects-more" id="projects-more"></div>
			</div>
		</section>

		<!-- Certificaciones / Estudios -->
		<section class="section" id="certificaciones" aria-labelledby="certifications-title">
			<div class="wrap">
				<h2 id="certifications-title"></h2>
				<p class="section-intro" id="certifications-intro"></p>
				<div class="certification-grid" id="certification-grid"></div>
			</div>
		</section>

		<!-- Contacto -->
		<section class="section" id="contacto" aria-labelledby="contact-title">
			<div class="wrap">
				<h2 id="contact-title"></h2>
				<p class="section-intro" id="contact-text"></p>
				<div class="contact-grid" id="contact-grid">
					<dl class="contact-list" id="contact-list"></dl>
					<div class="contact-highlights" id="contact-highlights"></div>
				</div>
			</div>
		</section>

	</main>

	<div class="cert-lightbox" id="cert-lightbox" hidden>
		<div class="cert-lightbox-backdrop" data-cert-close></div>
		<div class="cert-lightbox-panel" role="dialog" aria-modal="true" aria-labelledby="cert-lightbox-title">
			<div class="cert-lightbox-head">
				<h2 id="cert-lightbox-title"></h2>
				<button class="icon-btn cert-lightbox-close" id="cert-lightbox-close" type="button" aria-label="Cerrar">×</button>
			</div>
			<div class="cert-lightbox-content" id="cert-lightbox-content"></div>
		</div>
	</div>

	<footer class="site-footer">
		<div class="wrap">
			<p id="footer-text"></p>
		</div>
	</footer>

	<noscript>
		<p class="wrap noscript">Este sitio necesita JavaScript activado para mostrar su contenido.</p>
	</noscript>

	<!-- Paleta de comandos (Ctrl/Cmd + K): sus acciones se arman solas a partir
	     de los enlaces que ya existen en la página, así que si cambias config.js
	     no hay que tocar nada aquí. -->
	<div class="cmdk-overlay" id="cmdk-overlay" hidden>
		<div class="cmdk-panel" role="dialog" aria-modal="true" aria-label="Paleta de comandos">
			<div class="cmdk-inputwrap">
				<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
				<input id="cmdk-input" class="cmdk-input" type="text" placeholder="Buscar una acción…" autocomplete="off" spellcheck="false">
				<kbd class="cmdk-esc">Esc</kbd>
			</div>
			<ul class="cmdk-list" id="cmdk-list" role="listbox" aria-label="Acciones"></ul>
			<p class="cmdk-empty" id="cmdk-empty" hidden>Sin resultados</p>
		</div>
	</div>

	<!-- El contenido vive en config.js; app.js lo dibuja en la página -->
	<script src="js/logos.js" defer></script>
	<script src="js/config.js" defer></script>
	<script src="js/app.js" defer></script>
	<script src="js/effects.js" defer></script>
</body>
</html>
